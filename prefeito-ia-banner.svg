<title id="t">Prefeito IA — Cities: Skylines</title><desc id="d">Identidade gráfica do projeto de Erik Pedro: uma cidade desenhada em linhas verdes e azuis sobre fundo escuro. Ilustração, não captura do jogo.</desc>
